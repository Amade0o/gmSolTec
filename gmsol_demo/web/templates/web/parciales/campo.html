{# Un campo de formulario: etiqueta, control, ayuda y errores. Django ya agrega aria-describedby="<id>_helptext" y aria-invalid. #}
<div class="campo{% if campo.errors %} con-error{% endif %}{% if clase %} {{ clase }}{% endif %}">
<label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
{{ campo }}
{% if campo.help_text %}<small class="ayuda" id="{{ campo.auto_id }}_helptext">{{ campo.help_text }}</small>{% endif %}
{% for e in campo.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
