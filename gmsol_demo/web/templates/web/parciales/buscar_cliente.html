{# Elegir cliente: buscador (HTMX) + lista de todos los clientes. Necesita "oc" (ver views._opciones_cliente). #}
<label class="oculto" for="buscar-{{ oc.campo }}">Buscar cliente por nombre o teléfono</label>
<input type="search" id="buscar-{{ oc.campo }}" name="buscar_cliente" class="entrada" placeholder="Escribí el nombre o el teléfono…"
       spellcheck="false" autocomplete="off" aria-controls="opciones-{{ oc.campo }}" data-buscar-cliente
       hx-get="{% url 'web:buscar_clientes' %}" hx-trigger="input changed delay:250ms, search"
       hx-target="#opciones-{{ oc.campo }}" hx-swap="outerHTML" hx-sync="this:replace"
       hx-include="closest .elegir-cliente" hx-vals='{"campo": "{{ oc.campo }}"}'>
{% include "web/parciales/opciones_cliente.html" %}
