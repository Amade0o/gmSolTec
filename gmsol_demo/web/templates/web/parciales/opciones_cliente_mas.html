{% load formato %}{# Una parte de la lista de clientes + el aviso que pide la siguiente al quedar a la vista. #}
{% for c in oc.lista %}{% if oc.parte == 1 or c.pk != oc.elegido %}<label class="opcion"><input type="radio" name="{{ oc.campo }}" value="{{ c.pk }}"{% if c.pk == oc.elegido %} checked{% endif %}><span><span class="nombre">{{ c.nombre }}</span>{% with tel=c|telefono_principal %}{% if tel %}<small>{{ tel }}</small>{% endif %}{% endwith %}</span></label>
{% endif %}{% endfor %}{% if oc.siguiente %}<div class="mas-clientes" hx-get="{% url 'web:buscar_clientes' %}?campo={{ oc.campo|urlencode }}&amp;buscar_cliente={{ oc.q|urlencode }}&amp;parte={{ oc.siguiente }}&amp;{{ oc.campo|urlencode }}={{ oc.elegido|default_if_none:'' }}" hx-trigger="intersect once" hx-target="this" hx-swap="outerHTML"><small class="ayuda">Cargando más clientes…</small></div>{% endif %}
